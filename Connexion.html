<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connexion à l'espace Web4All">
    <link rel="stylesheet" href="style.css">
    <title>Connexion - Cesi Offres</title>
</head>
<body>

    <!-- HEADER (Identique à l'accueil) -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html">Cesi Offres</a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="offres.html">Offres</a></li>
                <li><a href="entreprises.html">Entreprises</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <div class="auth-card">
                <h1>Connexion</h1>
                <p>Accédez à votre espace étudiant ou pilote.</p>

                <!-- Le formulaire -->
                <form action="dashboard.php" method="POST" class="auth-form">
                    
                    <div class="form-group">
                        <label for="email">Adresse Email</label>
                        <input type="email" id="email" name="email" placeholder="exemple@viacesi.fr" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-footer">
                        <a href="#">Mot de passe oublié ?</a>
                    </div>

                    <button type="submit" class="btn-submit">Se connecter</button>
                </form>

                <div class="auth-switch">
                    <p>Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER (Identique à l'accueil) -->
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 Web4All - Tous droits réservés</p>
        </div>
    </footer>

</body>
</html>
